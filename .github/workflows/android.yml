name: Android APK

# APK de PRUEBA (arm64, sin Gradle, sin permisos). Modo de juego predeterminado: modo 4 (Json), con las 2 022 animaciones
# JSON convertidas (assets/animations/json_clips.res, json_scenes.res, json_keeper.res), el UNICO banco del juego: Mixamo y
# Mocap se borraron (2026-11-08, pedido del usuario); Tripo queda como respaldo del codigo heredado. La suite headless corre
# en el modo 4. Firmada con un keystore de DEPURACION estandar de Android
# (alias androiddebugkey, contrasena android) creado en cada ejecucion: no hay secretos ni clave permanente.
# Consecuencia: cada APK tiene una firma distinta, asi que hay que desinstalar la anterior antes de instalar la nueva.
# APK de prueba disponible exclusivamente como artefacto descargable; no publica Releases.

on:
  push:
    branches: [main, master, ccr-f4fb4f85-olnklr, ccr-a6c53cd2-uoxpk0, integracion-openai, reforma-tiros-penales, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Saltar las pruebas headless (solo para compilar rapido)"
        type: boolean
        default: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BASE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
  ANDROID_CMDLINE_TOOLS: "commandlinetools-linux-11076708_latest.zip"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_PLATFORM: "android-35"

jobs:
  apk:
    runs-on: ubuntu-24.04
    # La suite incluye partidos completos de 3, 5, 7 y 10 minutos de juego simulado.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Banco de animaciones JSON (unico banco)
        run: |
          for f in assets/animations/json_clips.res assets/animations/json_keeper.res assets/animations/json_scenes.res resources/setpiece/shot_clips.json; do
            [ -f "$f" ] || { echo "::error::Falta $f (banco JSON / catalogo de golpeos)."; exit 1; }
          done
          # Bancos borrados: Mixamo y Mocap viejos (2026-11-08) y la biblioteca nueva de Mixamo (2026-11-12, «muy feas»).
          for f in assets/animations/pack_clips.res assets/animations/pack_keeper.res assets/animations/mocap_clips.res assets/animations/touch_clips.res assets/animations/mixamo_clips.res assets/animations/mixamo_keeper.res assets/animations/mixamo_scenes.res resources/setpiece/shot_clips_mixamo.json; do
            [ ! -e "$f" ] || { echo "::error::$f es de un banco borrado (Mixamo/Mocap): no debe volver."; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Godot y plantilla Android (con cache)
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-stable-android

      - name: Descargar Godot y plantilla Android
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl ~/godot-bin && cd ~/godot-dl
          for f in SHA512-SUMS.txt "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$f" "$GODOT_BASE_URL/$f"
          done
          # Solo los dos ficheros exactos (el fichero de sumas incluye tambien las variantes mono).
          grep -E " Godot_v${GODOT_VERSION}-stable_(linux\.x86_64\.zip|export_templates\.tpz)\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d ~/godot-bin
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T" tpl
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/android_release.apk templates/version.txt -d tpl
          mv tpl/templates/* "$T"/
          cd ~ && rm -rf ~/godot-dl

      - name: Instalar Godot
        run: |
          sudo ln -sf ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Android SDK (plataforma, build-tools, platform-tools)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK" && cd "$SDK"
          curl -fsSL --retry 5 -o cmdtools.zip "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}"
          unzip -q -o cmdtools.zip && mkdir -p cmdline-tools/latest
          cp -r cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" > /dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${SDK}"
          TRES
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres

      - name: Importar el proyecto
        run: godot --headless --path . --import

      - name: Auditar cada animacion del banco sobre el esqueleto real
        env:
          OUT: ${{ runner.temp }}/integration_audit.json
        run: |
          set -o pipefail
          godot --headless --path . res://tools/integration/audit_bank.tscn 2>&1 | tee "$RUNNER_TEMP/integration_audit.log"
          if grep -q "SCRIPT ERROR\|Parse Error" "$RUNNER_TEMP/integration_audit.log"; then exit 1; fi
          python3 - <<'PY'
          import json, os
          with open(os.environ['OUT']) as f:
              report = json.load(f)
          assert report['sources'] == 2022, report['sources']
          assert report['failures'] == 0, report['failures']
          assert all(r['registered'] and r['invoked'] and r['pose_sampled'] and r['role_indexed'] for r in report['rows'])
          PY

      - name: Subir informe individual de animaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-audit
          path: |
            ${{ runner.temp }}/integration_audit.json
            ${{ runner.temp }}/integration_audit.log
          if-no-files-found: warn

      - name: Pruebas headless
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: |
          set -o pipefail
          tools/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/headless_tests.txt"
          if grep -q "SCRIPT ERROR\|Parse Error\|\[FAIL\]" "$RUNNER_TEMP/headless_tests.txt"; then exit 1; fi
          # Fugas al cerrar Godot (corregidas 2026-11-07: ciclos RefCounted de BallHandler): no deben volver.
          if grep -q "ObjectDB instances were leaked\|resources still in use at exit" "$RUNNER_TEMP/headless_tests.txt"; then echo "::error::fugas de ObjectDB o recursos al cerrar"; exit 1; fi

      # Pruebas que necesitan el esqueleto animado (toques de conduccion con el pie real, pie en la pelota al patear):
      # con render en un servidor X virtual.
      - name: Pruebas con render (pies animados)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: |
          set -o pipefail
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q xvfb libgl1-mesa-dri > /dev/null
          # Reforma (tiros libres y penales): sin las baterias del futbol 5 (conduccion y recepcion), que se quitaron de esta
          # rama; test_anim_bank_bench mide el golpe en el contacto del clip con el esqueleto animado; test_juggle_show (el pie
          # llega a la pelota en las dominadas) y test_custom_advanced (peinados y barbas pegados a la cabeza animada).
          for f in live_kicks pack_motion json_mode directional_kicks test_anim_bank_bench test_setpiece_render test_keeper_zones test_keeper_in_position test_juggle_show test_custom_advanced; do
            xvfb-run -a godot --display-driver x11 --rendering-driver opengl3 --fixed-fps 60 --path . res://tests/run_tests.tscn -- --filter "$f" 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/render_$f.txt"
            if grep -q "SCRIPT ERROR\|\[FAIL\]" "$RUNNER_TEMP/render_$f.txt"; then exit 1; fi
            if grep -q "ObjectDB instances were leaked\|resources still in use at exit" "$RUNNER_TEMP/render_$f.txt"; then echo "::error::fugas al cerrar en $f"; exit 1; fi
          done

      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/headless_tests.txt
            ${{ runner.temp }}/render_*.txt
          if-no-files-found: warn

      - name: Version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg

      - name: Keystore de depuracion estandar
        run: |
          KS="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 9125 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configuracion del servidor (clave PUBLICA desde GitHub Secrets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Solo la URL y la clave publica (anon/publishable). La service key nunca va en la APK.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::SUPABASE_ANON_KEY es una clave de servicio"; exit 1;; esac
            mkdir -p config
            python3 -c 'import json,os; json.dump({"url": os.environ["SUPABASE_URL"], "anon_key": os.environ["SUPABASE_ANON_KEY"]}, open("config/backend.json", "w"))'
            echo "backend.json generado: la APK usa el servidor"
          else
            echo "::warning::Sin SUPABASE_URL/SUPABASE_ANON_KEY: la APK usa la cuenta local de prueba (sin online real)"
          fi

      - name: Exportar APK firmada
        run: |
          mkdir -p build
          godot --headless --path . --export-release Android build/futbol5.apk
          test -s build/futbol5.apk

      - name: Verificar firma, certificado y contenido
        run: |
          BT="$HOME/android-sdk/build-tools/${ANDROID_BUILD_TOOLS}"
          APK=build/futbol5.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verify.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/verify.txt"
          grep -q "Number of signers: 1" "$RUNNER_TEMP/verify.txt"
          FPR=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/verify.txt" | awk '{print $NF}')
          echo "CERT_SHA256=$FPR" >> "$GITHUB_ENV"
          BADGING=$("$BT/aapt2" dump badging "$APK" 2>/dev/null)
          echo "$BADGING" | grep -E "^package:|native-code"
          echo "$BADGING" | grep -q "package: name='com.webmaletin.futbol5' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'"
          # Unico permiso: INTERNET (cuentas y online). Cualquier otro es un error.
          echo "$BADGING" | grep -q "uses-permission: name='android.permission.INTERNET'" || { echo "::error::falta el permiso INTERNET (el online no funcionaria)"; exit 1; }
          OTHER=$(echo "$BADGING" | grep "uses-permission" | grep -v "android.permission.INTERNET" || true)
          if [ -n "$OTHER" ]; then echo "::error::la APK declara permisos inesperados: $OTHER"; exit 1; fi

          # Los bancos borrados (Mixamo y Mocap) no estan en la APK.
          if unzip -l "$APK" | grep -E -q "animations/(pack_clips|pack_keeper|mocap_clips|touch_clips|mixamo_clips|mixamo_keeper|mixamo_scenes)\.res|characters/mocap/|shot_clips_mixamo"; then echo "::error::la APK contiene un banco borrado (Mixamo/Mocap)"; exit 1; fi
          # Modo 4 (Json): librerias de clips (identicas a las del repositorio) dentro de la APK.
          if unzip -l "$APK" | grep -E -q "animations/source/"; then echo "::error::la APK contiene GLB fuente de animaciones"; exit 1; fi
          for f in animations/json_clips.res animations/json_scenes.res animations/json_keeper.res; do
            unzip -l "$APK" | grep -q "$f" || { echo "::error::$f no esta en la APK"; exit 1; }
            unzip -p "$APK" "assets/assets/$f" | cmp -s - "assets/$f" || { echo "::error::$f de la APK difiere del repositorio"; exit 1; }
          done
          # Cuerpo de los jugadores: el modelo de Tripo adaptado (el humanoide JSON se elimino) y el numero impreso.
          for f in characters/json/tripo_body.scn characters/player/number_atlas.png; do
            unzip -l "$APK" | grep -q "$f" || { echo "::error::$f no esta en la APK (cuerpo de los jugadores)"; exit 1; }
          done
          if unzip -l "$APK" | grep -q "characters/json/json_human"; then echo "::error::el humanoide eliminado volvio a la APK"; exit 1; fi
          unzip -l "$APK" | grep -q "animations/footballer_clips.res" || { echo "::error::faltan los clips de Tripo (respaldo)"; exit 1; }
          # Modos de tiros libres y penales: catalogo de golpeos medidos (sin el no hay golpeos) y catalogo de bancos.
          unzip -p "$APK" "assets/resources/setpiece/shot_clips.json" | cmp -s - resources/setpiece/shot_clips.json || { echo "::error::resources/setpiece/shot_clips.json no esta en la APK o difiere"; exit 1; }
          unzip -l "$APK" | grep -q "resources/animation/catalogo_bancos.json" || { echo "::error::falta el catalogo de bancos en la APK"; exit 1; }
          # Datos de la Academia, la Arena y los minijuegos (JSON: solo entran si estan en include_filter).
          for f in resources/challenges/challenges.json resources/minigames/minigames.json resources/online/seed.json; do
            unzip -p "$APK" "assets/$f" | cmp -s - "$f" || { echo "::error::$f no esta en la APK o difiere"; exit 1; }
          done
          if unzip -l "$APK" | grep -E -q "\.fbx"; then echo "::error::la APK contiene FBX fuente"; exit 1; fi

          # Integridad y arquitectura reales del binario (no solo lo que declara el manifiesto).
          unzip -tq "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK"
          SIZE=$(stat -c %s "$APK")
          [ "$SIZE" -gt 20000000 ] || { echo "::error::APK demasiado pequena ($SIZE bytes)"; exit 1; }
          LIBS=$(unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          [ "$LIBS" = "arm64-v8a " ] || { echo "::error::ABIs inesperadas en la APK: $LIBS"; exit 1; }
          unzip -p "$APK" lib/arm64-v8a/libgodot_android.so > "$RUNNER_TEMP/libgodot.so"
          file "$RUNNER_TEMP/libgodot.so" | grep -q "ARM aarch64" || { echo "::error::libgodot_android.so no es ARM64"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "minSdkVersion|targetSdkVersion"

          NAME="futbol5-v${VERSION_NAME}.apk"
          cp "$APK" "build/$NAME"
          (cd build && sha256sum "$NAME" > "$NAME.sha256")
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c %s "build/$NAME")" >> "$GITHUB_ENV"
          {
            echo "### Futbol 5 APK ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "- Tamano: $(du -h "build/$NAME" | cut -f1) · arm64-v8a · sin permisos"
            echo "- Firma de DEPURACION verificada (v2), SHA-256 del certificado: \`${FPR}\` (clave de depuracion de esta ejecucion)"
            echo "- Animaciones: banco JSON original (unico; Mixamo y Mocap borrados) + respaldo Tripo del codigo heredado"
            echo "- Modo 4 (Json): librerias y humanoide incluidos; invocacion y muestreo de poses por clip en el artefacto animation-audit. La inclusion no certifica conexion situacional ni verificacion visual individual."
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- SHA-256 de la APK: \`$(cut -d' ' -f1 "build/$NAME.sha256")\` · zip integro y alineado · libgodot_android.so ELF aarch64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: futbol5-apk
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
          retention-days: 14
          if-no-files-found: error

  # Servidor: las migraciones de Supabase y sus pruebas sobre PostgreSQL (no frena la APK).
  servidor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones y pruebas SQL (RLS, autoridad del servidor)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres env PGHOST=/var/run/postgresql bash supabase/tests/run_local.sh
